name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # build_pages.py itself only uses the standard library, but it shells out
      # to earth_texture_lod.py to re-sign the texture manifests, and that one
      # needs Pillow. Reading only the entry point's imports is how this step
      # was first shipped without it, and the build failed in CI.
      - name: Install build dependencies
        run: pip install "Pillow>=10,<12"

      # build_pages.py is the public projection of the release: it copies only
      # what a browser is allowed to see and leaves the optional high-resolution
      # texture pack out, so dist/ can be published as-is.
      - name: Build the publishable map
        run: python build_pages.py --output dist --force

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
